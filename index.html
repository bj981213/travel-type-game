<meta property="og:title" content="出發吧！你是哪種旅人？">
<meta property="og:description" content="跟著一趟四天的旅程回答 12 題，測出你是 8 種旅人中的哪一種，並推薦目的地與旅遊書。">

<style>
/* Layout: a travel picture-diary held open — taped-in illustration, question written below, answer cards like notes; the result is a diary page with a portrait and a rubber stamp. */
:root{
  --paper:#fff7ea;     /* drawing paper */
  --paper-2:#fbe8cc;
  --card:#fffdf7;
  --ink:#4b3a30;       /* brown pencil */
  --ink-soft:#80695a;
  --line:#ead6b9;
  --peach:#ef9a78;
  --peach-deep:#d9785a;
  --butter:#f5d07a;
  --sky:#8fc4e0;
  --sakura:#f0a8b8;
  --leaf:#95bf86;
  --f-disp:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Sans TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-latin:"Patrick Hand","Huninn",ui-rounded,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(128,105,90,.07) 1px,transparent 1.2px),radial-gradient(rgba(128,105,90,.05) 1px,transparent 1.2px);
  background-size:22px 22px,31px 31px;background-position:0 0,11px 7px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px dashed var(--peach-deep);outline-offset:3px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 36px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.hand{border:2px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-disp);font-size:18px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:var(--peach);display:inline-block;box-shadow:inset -3px -3px 0 rgba(0,0,0,.08)}
.ghost{background:var(--card);border:1.5px solid var(--ink-soft);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ink-soft)}
.ghost:hover{color:var(--ink);border-color:var(--ink)}

/* route */
.route{position:relative;display:grid;grid-template-columns:repeat(6,1fr);align-items:start}
.route::before{content:"";position:absolute;left:8.33%;right:8.33%;top:10px;border-top:2.5px dotted var(--ink-soft);opacity:.5}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.3}
.stop i{width:20px;height:20px;border-radius:50% 45% 52% 48%;background:var(--card);border:2px solid var(--ink-soft);display:block;transition:background .3s,transform .3s}
.stop.done i{background:var(--leaf);border-color:var(--ink)}
.stop.now i{background:var(--butter);border-color:var(--ink);transform:scale(1.15) rotate(-6deg)}
.stop.now{color:var(--ink);font-weight:700}

/* illustration taped into the diary */
.scene{position:relative;background:var(--card);padding:8px;max-width:100%;transform:rotate(-.6deg);box-shadow:0 3px 0 rgba(75,58,48,.08)}
.scene canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:6px}
.tape{position:absolute;width:74px;height:22px;background:rgba(245,208,122,.72);top:-10px;transform:rotate(-8deg);left:18px;border-left:2px dotted rgba(255,255,255,.6);border-right:2px dotted rgba(255,255,255,.6)}
.tape.r{left:auto;right:18px;transform:rotate(7deg);background:rgba(240,168,184,.7)}
.scene .tag{position:absolute;right:16px;bottom:14px;font-family:var(--f-hand);font-size:14px;background:var(--card);padding:1px 10px;border-radius:10px;border:1.5px solid var(--ink-soft)}

/* question */
.q{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--f-hand);font-size:15px;color:var(--peach-deep);font-weight:700}
.q h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(21px,5.6vw,26px);line-height:1.5;margin:0;text-wrap:balance;min-height:3em}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;text-align:left;background:var(--card);color:var(--ink);padding:12px 14px 12px 12px;position:relative;opacity:0;transform:translateY(6px) rotate(0deg);transition:opacity .3s,transform .3s,background .2s}
.opt.in{opacity:1;transform:none}
.opt:nth-child(2).in{transform:rotate(.4deg)}
.opt:nth-child(3).in{transform:rotate(-.3deg)}
.opt .k{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-latin);font-size:20px;background:var(--paper-2);border:1.5px solid var(--ink-soft)}
.opt .txt{font-size:15.5px;line-height:1.6;min-width:0}
.opt:hover{background:#fff3df}
.opt.picked{background:#fff0d6}
.opt.picked .k{background:var(--peach);color:#fff;border-color:var(--ink)}
.opt.picked::after{content:"就是這個！";position:absolute;right:10px;top:-12px;font-family:var(--f-hand);font-weight:700;font-size:14px;color:#fff;background:var(--peach-deep);padding:0 10px;border-radius:12px;transform:rotate(4deg);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:rotate(4deg) scale(.3);opacity:0}to{transform:rotate(4deg) scale(1);opacity:1}}
.qfoot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft)}

/* title */
.hero{display:flex;flex-direction:column;gap:18px}
.ticket{background:var(--card);display:grid;grid-template-columns:1fr auto;gap:10px;padding:16px 18px;position:relative;transform:rotate(.5deg)}
.ticket .main{display:flex;flex-direction:column;gap:8px;min-width:0}
.tk-top{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--f-hand);font-size:14px;color:var(--ink-soft)}
.tk-top b{background:var(--sakura);color:var(--ink);padding:0 8px;border-radius:8px;font-weight:700}
.fromto{display:flex;align-items:baseline;gap:10px;font-family:var(--f-disp);font-size:30px;line-height:1.1}
.fromto .arr{font-size:18px;color:var(--peach-deep)}
.fromto .unk{color:var(--peach-deep)}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,8.2vw,38px);line-height:1.3;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--ink-soft)}
.punch{width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-left:2px dashed var(--line);padding-left:10px;font-family:var(--f-hand);font-size:13px;color:var(--ink-soft);text-align:center;line-height:1.3}
.punch span{font-family:var(--f-disp);font-size:20px;color:var(--ink)}
.go{background:var(--peach);color:#fff;border:2px solid var(--ink);border-radius:18px 22px 16px 24px;padding:13px 18px;font-family:var(--f-disp);font-size:21px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.go:hover{background:var(--peach-deep)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lbl{font-family:var(--f-hand);font-size:14px;color:var(--ink-soft)}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{background:var(--card);border:1.5px dashed var(--ink-soft);border-radius:14px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:0}
.mini b{font-family:var(--f-latin);font-weight:400;font-size:17px;line-height:1.1;color:var(--peach-deep)}
.mini span{font-family:var(--f-disp);font-size:14px;line-height:1.35}
.mini.me{border-style:solid;border-color:var(--ink);background:#fff0d6}

/* result: diary page */
.diary{background:var(--card);padding:26px 18px 22px;display:flex;flex-direction:column;gap:20px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);background-position:0 18px}
.diary > *{position:relative}
.dline{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-hand);font-size:15px;color:var(--ink-soft);border-bottom:2px solid var(--ink);padding-bottom:6px}
.dhead{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.polaroid{background:#fff;padding:7px 7px 24px;border:1.5px solid var(--line);box-shadow:0 3px 8px rgba(75,58,48,.12);transform:rotate(-3deg);position:relative}
.polaroid canvas{display:block;width:100%;aspect-ratio:1;border-radius:3px}
.polaroid em{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:var(--f-hand);font-style:normal;font-size:13px;color:var(--ink-soft)}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
.who .code{font-family:var(--f-latin);font-size:22px;color:var(--peach-deep);letter-spacing:2px;line-height:1}
.who h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(32px,9vw,40px);line-height:1.2;margin:0}
.who .ax{font-size:13px;color:var(--ink-soft)}
.stampmark{position:absolute;right:4px;top:-6px;width:82px;height:82px;border:3px solid var(--peach-deep);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--peach-deep);font-family:var(--f-disp);font-size:13px;line-height:1.3;transform:rotate(14deg);opacity:.85;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both .2s;background:rgba(255,253,247,.6)}
@keyframes stamp{from{transform:rotate(14deg) scale(2);opacity:0}to{transform:rotate(14deg) scale(1);opacity:.85}}
.ddesc{font-family:var(--f-hand);font-size:20px;line-height:1.6;margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:19px;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--butter);border:2px solid var(--ink);flex:none}
.axis{display:grid;grid-template-columns:4.4em 1fr 4.4em;align-items:center;gap:8px;font-size:13.5px}
.axis .l{text-align:right}
.axis .track{height:12px;background:var(--paper-2);border-radius:8px;position:relative;overflow:hidden;border:1.5px solid var(--ink-soft)}
.axis .track i{position:absolute;top:0;bottom:0;background:var(--sky)}
.axis .track::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed var(--ink-soft)}
.axis .on{font-weight:700}
.axis .off{color:var(--ink-soft)}
.dests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dest{background:#fff;border:1.5px solid var(--ink-soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dest:nth-child(1){transform:rotate(-1.2deg)} .dest:nth-child(3){transform:rotate(1deg)}
.dest .lbl{font-size:13px}
.dest b{font-family:var(--f-disp);font-weight:400;font-size:17px;line-height:1.35}
.books{display:flex;flex-direction:column;gap:10px}
.book{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;text-decoration:none;padding:10px;border-radius:14px;background:#fff;border:1.5px solid var(--line)}
.book:hover{border-color:var(--ink-soft)}
.spine{width:44px;height:64px;border-radius:4px 8px 8px 4px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--f-disp);font-size:12px;letter-spacing:2px;color:var(--ink);border:1.5px solid var(--ink);box-shadow:inset 5px 0 0 rgba(75,58,48,.12)}
.book > div{min-width:0}
.book .bt{font-weight:700;font-size:15px;line-height:1.45}
.book .bm{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.book .bb{font-size:13.5px;margin-top:4px}
.book .go-link{font-size:12.5px;color:var(--peach-deep);margin-top:4px;font-weight:700}
.more{align-self:flex-start;background:var(--card);border:1.5px solid var(--ink-soft);border-radius:999px;padding:3px 14px;font-size:13px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair > div{border-radius:14px;padding:10px 12px;background:#fff;border:1.5px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:2px}
.pair b{font-family:var(--f-disp);font-weight:400;font-size:18px}
.pair p{margin:0;font-size:13px;color:var(--ink-soft)}
.note{margin:0;font-family:var(--f-hand);font-size:17px;background:#fff6c9;padding:10px 14px;border-radius:4px;transform:rotate(-.6deg);box-shadow:0 2px 0 rgba(75,58,48,.08)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts button{flex:1 1 140px;border-radius:16px;padding:11px 14px;font-family:var(--f-disp);font-size:16px;border:2px solid var(--ink)}
.acts .primary{background:var(--peach);color:#fff;box-shadow:0 3px 0 var(--ink)}
.acts .secondary{background:var(--card);color:var(--ink)}
.toast{font-size:13.5px;color:var(--peach-deep);min-height:1.4em;font-weight:500}
.foot{font-size:12px;color:var(--ink-soft);line-height:1.6}
@media (max-width:420px){
  .dests{grid-template-columns:1fr}
  .dhead{grid-template-columns:116px 1fr;gap:12px}
  .stampmark{width:66px;height:66px;font-size:11px}
  .stamps{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let cv=null, cx=null, sceneKey='title', raf=0, t0=performance.now(), cache=null, cacheBoil=-1, scale=2;
function frame(now){
  if(!cx){ raf=0; return; }
  const t=(now-t0)/1000, boil=reduce?0:Math.floor(t*4), sc=SCENES[sceneKey]||SCENES.title;
  if(boil!==cacheBoil){ const g=cache.getContext('2d'); g.setTransform(scale,0,0,scale,0,0); g.clearRect(0,0,W,H); seed=1+boil*7919; sc.bg(g); cacheBoil=boil; }
  cx.setTransform(1,0,0,1,0,0); cx.drawImage(cache,0,0); cx.setTransform(scale,0,0,scale,0,0); seed=2+boil*104729; sc.fg(cx,t);
  raf = reduce ? 0 : requestAnimationFrame(frame);
}
function mountScene(el,key){
  scale=Math.min(4,Math.max(2,Math.ceil((window.devicePixelRatio||1)*1.5)));
  cv=el; cx=cv.getContext('2d'); cv.width=W*scale; cv.height=H*scale; cache=document.createElement('canvas'); cache.width=cv.width; cache.height=cv.height; cacheBoil=-1; sceneKey=key;
  Snd.rain(key==='rain');
  if(!raf) raf=requestAnimationFrame(frame);
}
/* 結果頁肖像：角色＋依類型不同的道具 */
function portrait(el,code,size=300){
  const g=el.getContext('2d'); el.width=size; el.height=size; const k=size/120; g.setTransform(k,0,0,k,0,0); seed=7;
  const bgc={PCS:'#ffe2c4',PCL:'#e3f0dc',PAS:'#dbeaf5',PAL:'#e8e2f2',FCS:'#ffe0d6',FCL:'#f5ead6',FAS:'#d8eef5',FAL:'#f0e4ee'}[code];
  g.fillStyle=bgc; g.fillRect(0,0,120,120); circ(g,22,22,10,'#fff6e0','#e9cf85',1,false);
  const pose=code==='PCS'?'wave':'stand';
  traveler(g,58,112,{pose,s:1.25});
  if(code==='PCS'){ ln(g,72,58,72,24,INK,1.4); shape(g,[[72,24],[94,30],[72,36]],'#ef9a78'); }
  if(code==='PCL'){ rr(g,40,66,40,26,2,'#fff8e0'); ln(g,50,66,50,92,'#c9b8a6',1); ln(g,60,66,60,92,'#c9b8a6',1); ln(g,44,80,76,74,'#d9785a',1.4); }
  if(code==='PAS'){ circ(g,52,48,4,'#4b3a30'); circ(g,64,48,4,'#4b3a30'); }
  if(code==='PAL'){ circ(g,84,74,8,'rgba(191,224,241,.7)',INK,1.6,false); ln(g,79,80,72,90,INK,2.2); }
  if(code==='FCS'){ rr(g,42,72,32,14,7,'#fffaf0'); rr(g,44,70,28,4,2,'#ef9a78',INK,1,false); ln(g,64,70,76,58,INK,1); ln(g,67,70,79,59,INK,1); }
  if(code==='FCL'){ rr(g,74,70,12,13,3,'#fffaf0'); circ(g,88,76,3,null,INK,1.2,false); g.strokeStyle='rgba(150,130,120,.7)'; g.beginPath(); g.moveTo(80,66); g.bezierCurveTo(84,62,76,58,80,54); g.stroke(); }
  if(code==='FAS'){ circ(g,58,88,22,null,'#ef7a5a',5,false,7); circ(g,58,88,22,null,INK,1,false,7); }
  if(code==='FAL'){ cat(g,94,104,.8,false); }
}

function getDownloads(){ if(!dlP) dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(webDownloads); return dlP; }
async function drawCard(code,T){
  try{ await Promise.all(['40px "Huninn"','700 40px "LXGW WenKai TC"','40px "Patrick Hand"','500 30px "Noto Sans TC"'].map(f=>document.fonts.load(f,'旅人ABC'))); }catch(e){}
  const c=document.createElement('canvas'); c.width=1080; c.height=1350; const g=c.getContext('2d');
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  g.fillStyle=css('--paper-2'); g.fillRect(0,0,1080,1350);
  g.fillStyle=css('--card'); g.beginPath(); g.roundRect?g.roundRect(60,70,960,1210,36):g.rect(60,70,960,1210); g.fill(); g.strokeStyle=css('--ink'); g.lineWidth=5; g.stroke();
  g.strokeStyle=css('--line'); g.lineWidth=2; for(let y=170;y<1260;y+=64){ g.beginPath(); g.moveTo(100,y); g.lineTo(980,y); g.stroke(); }
  g.save(); g.translate(170,72); g.rotate(-.14); g.fillStyle='rgba(245,208,122,.8)'; g.fillRect(-90,-26,180,52); g.restore();
  g.save(); g.translate(910,72); g.rotate(.12); g.fillStyle='rgba(240,168,184,.8)'; g.fillRect(-90,-26,180,52); g.restore();
  g.fillStyle=css('--ink-soft'); g.font='700 38px "LXGW WenKai TC", serif'; g.fillText(`${today()}　天氣：${WEATHER[code]}`,110,155);
  const pc=document.createElement('canvas'); portrait(pc,code,420);
  g.save(); g.translate(300,480); g.rotate(-.05); g.fillStyle='#fff'; g.shadowColor='rgba(75,58,48,.18)'; g.shadowBlur=18; g.fillRect(-235,-235,470,540); g.shadowBlur=0; g.drawImage(pc,-210,-210,420,420); g.fillStyle=css('--ink-soft'); g.font='700 34px "LXGW WenKai TC", serif'; g.textAlign='center'; g.fillText(PROP_NAME[code],0,268); g.restore();
  g.textAlign='left'; g.fillStyle=css('--ink-soft'); g.font='700 36px "LXGW WenKai TC", serif'; g.fillText('今天的我是',580,330);
  g.fillStyle=css('--peach-deep'); g.font='64px "Patrick Hand", sans-serif'; g.fillText(code,580,410);
  g.fillStyle=css('--ink'); g.font='92px "Huninn", sans-serif'; g.fillText(T.name,574,520);
  g.fillStyle=css('--ink-soft'); g.font='500 28px "Noto Sans TC", sans-serif'; g.fillText(T.axes,580,575);
  g.save(); g.translate(890,250); g.rotate(.24); g.strokeStyle=css('--peach-deep'); g.lineWidth=7; g.beginPath(); g.arc(0,0,92,0,7); g.stroke(); g.fillStyle=css('--peach-deep'); g.textAlign='center'; g.font='36px "Huninn", sans-serif'; g.fillText(T.name,0,0); g.fillText('認證',0,44); g.restore();
  g.textAlign='left'; g.fillStyle=css('--ink'); g.font='700 46px "LXGW WenKai TC", serif'; wrap(g,T.desc,110,880,860,64);
  g.fillStyle=css('--ink'); g.font='40px "Huninn", sans-serif'; g.fillText('下一站去哪裡',110,1040);
  T.dest.forEach((d,i)=>{ const x=110+i*292; g.fillStyle='#fff'; g.strokeStyle=css('--ink-soft'); g.lineWidth=3; g.beginPath(); g.roundRect?g.roundRect(x,1066,272,120,22):g.rect(x,1066,272,120); g.fill(); g.stroke(); g.fillStyle=css('--ink-soft'); g.font='700 28px "LXGW WenKai TC", serif'; g.fillText(destTag(d),x+22,1106); g.fillStyle=css('--ink'); g.font='36px "Huninn", sans-serif'; wrap(g,destName(d),x+22,1152,236,42); });
  g.fillStyle=css('--peach-deep'); g.font='38px "Huninn", sans-serif'; g.fillText('出發吧！你是哪種旅人？',110,1250);
  return new Promise(res=>c.toBlob(res,'image/png'));
}
function wrap(g,text,x,y,maxW,lh){ let line=''; for(const ch of text){ if(g.measureText(line+ch).width>maxW){ g.fillText(line,x,y); line=ch; y+=lh; } else line+=ch; } if(line) g.fillText(line,x,y); }

sndBtn.onclick=()=>{ const on=Snd.toggle(); sndBtn.textContent='音效 '+(on?'開':'關'); sndBtn.setAttribute('aria-pressed',on); if(on&&sceneKey==='rain'&&S.screen==='play') Snd.rain(true); };

if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ cacheBoil=-1; });
render();
