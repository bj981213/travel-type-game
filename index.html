<meta property="og:description" content="跟著一趟四天的旅程回答 12 題，測出你是 8 種旅人中的哪一種，並推薦目的地與旅遊書。">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=VT323&display=swap">
<style>
/* Layout: one phone-width column like a passport held in hand — route strip, pixel scene window, boarding-pass answer tickets; result is a passport visa page. */
:root{
  --cover:#163a30;      /* ROC passport green */
  --cover-2:#1f4b3e;
  --cover-line:#2f6352;
  --gold:#d8b25a;       /* passport foil */
  --paper:#eef0e6;      /* boarding-pass stock */
  --paper-2:#e2e6d8;
  --ink:#1b2823;
  --ink-soft:#4f5f57;
  --stamp:#c0473a;      /* red visa ink */
  --stamp-blue:#2e5c8c; /* blue entry-stamp ink */
  --mist:#9fb6aa;
  --f-disp:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-code:"VT323",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--cover);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(circle at 50% -10%,var(--cover-2),var(--cover) 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 32px;display:flex;flex-direction:column;gap:14px;min-height:100%}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-code);font-size:20px;letter-spacing:2px;color:var(--gold);line-height:1}
.brand small{color:var(--mist);font-size:16px;letter-spacing:1px;margin-left:6px}
.ghost{background:none;border:1px solid var(--cover-line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--mist)}
.ghost:hover{color:var(--paper);border-color:var(--mist)}

/* route strip */
.route{position:relative;display:grid;grid-template-columns:repeat(6,1fr);align-items:start;padding-top:4px}
.route::before{content:"";position:absolute;left:8.33%;right:8.33%;top:11px;border-top:2px dashed var(--cover-line)}
.route .fill{position:absolute;left:8.33%;top:10px;height:4px;background:var(--gold);border-radius:2px;transition:width .5s ease}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mist);text-align:center}
.stop i{width:14px;height:14px;border-radius:50%;background:var(--cover);border:2px solid var(--cover-line);display:block;transition:all .3s}
.stop.done i{background:var(--gold);border-color:var(--gold)}
.stop.now i{border-color:var(--gold);box-shadow:0 0 0 4px rgba(216,178,90,.25)}
.stop.now{color:var(--paper)}

/* scene window */
.scene{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--cover-line);background:#0d1f1a;aspect-ratio:16/9;max-width:100%}
.scene canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.scene .tag{position:absolute;left:10px;top:8px;font-family:var(--f-code);font-size:18px;line-height:1;letter-spacing:1px;color:var(--paper);background:rgba(13,31,26,.72);padding:4px 8px;border-radius:6px}

/* question */
.q{display:flex;flex-direction:column;gap:12px}
.q .eyebrow{font-family:var(--f-code);font-size:18px;letter-spacing:1.5px;color:var(--gold);line-height:1}
.q h2{font-family:var(--f-disp);font-weight:700;font-size:clamp(21px,5.4vw,26px);line-height:1.45;margin:0;text-wrap:balance;min-height:2.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.ticket{display:grid;grid-template-columns:44px 1fr;align-items:stretch;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:10px;padding:0;overflow:hidden;position:relative;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s,box-shadow .2s}
.ticket.in{opacity:1;transform:none}
.ticket .stub{font-family:var(--f-code);font-size:24px;display:grid;place-items:center;background:var(--paper-2);color:var(--stamp-blue);border-right:2px dashed #b9c0ad}
.ticket .txt{padding:12px 14px;font-size:15.5px;line-height:1.55;min-width:0}
.ticket:hover{box-shadow:0 0 0 2px var(--gold)}
.ticket.picked .stub{background:var(--stamp);color:var(--paper)}
.ticket.picked::after{content:"已選";position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(-12deg);font-family:var(--f-disp);font-weight:700;color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:0 6px;font-size:14px;animation:thunk .25s ease-out}
@keyframes thunk{from{transform:translateY(-50%) rotate(-12deg) scale(1.8);opacity:0}to{transform:translateY(-50%) rotate(-12deg) scale(1);opacity:1}}
.qfoot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mist)}

/* title screen */
.hero{display:flex;flex-direction:column;gap:16px}
.pass{background:var(--paper);color:var(--ink);border-radius:14px;display:grid;grid-template-columns:1fr 92px;overflow:hidden}
.pass .main{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pass .side{background:var(--paper-2);border-left:2px dashed #b9c0ad;padding:14px 10px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-code);color:var(--ink-soft);font-size:15px;text-align:center;line-height:1.1}
.pass .side b{font-size:30px;color:var(--ink);font-weight:400}
.lbl{font-family:var(--f-code);font-size:15px;letter-spacing:1.5px;color:var(--ink-soft);line-height:1}
.fromto{display:flex;align-items:center;gap:10px;font-family:var(--f-code);font-size:44px;line-height:1;color:var(--ink)}
.fromto span:nth-child(2){font-size:22px;color:var(--stamp-blue)}
.fromto .unk{color:var(--stamp)}
.hero h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(28px,8vw,38px);line-height:1.25;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--ink-soft);font-size:14.5px}
.go{background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:14px 18px;font-family:var(--f-disp);font-weight:700;font-size:20px;display:flex;justify-content:center;gap:10px;align-items:center}
.go:hover{filter:brightness(1.06)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mist)}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{border:1.5px solid var(--cover-line);border-radius:10px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;background:none}
.mini b{font-family:var(--f-code);font-weight:400;font-size:22px;line-height:1;color:var(--gold);letter-spacing:1px}
.mini span{font-family:var(--f-disp);font-size:14px;line-height:1.3}
.mini.me{border-color:var(--gold);background:rgba(216,178,90,.12)}

/* result: passport visa page */
.visa{background:var(--paper);color:var(--ink);border-radius:16px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.visa::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(46,92,140,.045) 0 2px,transparent 2px 9px);pointer-events:none}
.visa > *{position:relative}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.code{font-family:var(--f-code);font-size:84px;line-height:.8;letter-spacing:4px;color:var(--ink)}
.vname{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1.2;margin:4px 0 0}
.vaxes{font-size:13px;color:var(--ink-soft)}
.seal{flex:none;width:96px;height:96px;border:3px double var(--stamp);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--stamp);font-family:var(--f-disp);font-weight:700;font-size:15px;line-height:1.25;transform:rotate(-14deg);animation:seal .5s cubic-bezier(.2,1.6,.4,1) both .15s}
.seal small{display:block;font-family:var(--f-code);font-weight:400;font-size:14px;letter-spacing:1px}
@keyframes seal{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.vdesc{font-family:var(--f-disp);font-size:19px;line-height:1.6;margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-family:var(--f-code);font-weight:400;font-size:18px;letter-spacing:1.5px;color:var(--stamp-blue);display:flex;gap:8px;align-items:baseline}
.sec h3 span{font-family:var(--f-body);font-size:13px;letter-spacing:0;color:var(--ink-soft)}
.axis{display:grid;grid-template-columns:4.6em 1fr 4.6em;align-items:center;gap:8px;font-size:13px}
.axis .l{text-align:right}
.axis .track{height:10px;background:var(--paper-2);border-radius:5px;position:relative;overflow:hidden}
.axis .track i{position:absolute;top:0;bottom:0;background:var(--stamp-blue);border-radius:5px}
.axis .track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1.5px solid var(--ink-soft);opacity:.5}
.axis .on{font-weight:700;color:var(--ink)}
.axis .off{color:var(--ink-soft)}
.dests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dest{border:1.5px solid #c8cdbd;border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;background:rgba(255,255,255,.35)}
.dest .lbl{font-size:13px}
.dest b{font-family:var(--f-disp);font-size:17px;line-height:1.3}
.books{display:flex;flex-direction:column;gap:10px}
.book{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start;text-decoration:none;padding:10px;border-radius:10px;background:rgba(255,255,255,.45);border:1.5px solid #d3d8c8}
.book:hover{border-color:var(--stamp-blue)}
.spine{width:46px;height:66px;border-radius:3px 6px 6px 3px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:2px;color:#fff;box-shadow:inset 4px 0 0 rgba(0,0,0,.18)}
.book .bt{font-weight:700;font-size:15px;line-height:1.45;color:var(--ink)}
.book .bm{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.book .bb{font-size:13.5px;color:var(--ink);margin-top:4px}
.book .go-link{font-size:12.5px;color:var(--stamp-blue);margin-top:4px;font-weight:500}
.book > div{min-width:0}
.more{align-self:flex-start;background:none;border:1.5px solid var(--ink-soft);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:13px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair > div{border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.45);border:1.5px solid #d3d8c8;min-width:0;display:flex;flex-direction:column;gap:2px}
.pair b{font-family:var(--f-disp);font-size:18px}
.pair p{margin:0;font-size:13px;color:var(--ink-soft)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.acts button{flex:1 1 140px;border-radius:12px;padding:12px 14px;font-weight:700;border:0}
.acts .primary{background:var(--gold);color:var(--ink)}
.acts .secondary{background:none;border:1.5px solid var(--mist);color:var(--paper)}
.toast{font-size:13px;color:var(--gold);min-height:1.4em}
.foot{font-size:12px;color:var(--mist);line-height:1.6}
.foot a{color:var(--paper)}
@media (max-width:400px){
  .dests{grid-template-columns:1fr}
  .code{font-size:68px}
  .seal{width:80px;height:80px;font-size:13px}
  .stamps{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

const Snd = (() => {

  function tone(f, t0, d, type='sine', g=.12){ const a=ctx(); if(!a||!on) return; const o=a.createOscillator(), v=a.createGain(); o.type=type; o.frequency.value=f; v.gain.setValueAtTime(0,a.currentTime+t0); v.gain.linearRampToValueAtTime(g,a.currentTime+t0+.01); v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d); o.connect(v).connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+d+.05); }

  return {
    pick(){ tone(660,0,.18,'triangle',.1); tone(990,.07,.25,'triangle',.08); },
    stamp(){ if(!on) return; const n=noise(.12,.35,600); if(n){ n.s.start(); } tone(110,0,.15,'sine',.25); },
    chime(){ tone(784,0,.6,'sine',.09); tone(622,.45,.9,'sine',.09); },
    done(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.5,'triangle',.08)); },
    rain(want){ const a=ctx(); if(want&&on&&a&&!rain){ const n=noise(2,.05,1200); if(!n) return; n.s.loop=true; n.s.start(); rain=n; } else if((!want||!on)&&rain){ try{rain.s.stop();}catch(e){} rain=null; } },
    toggle(){ on=!on; if(!on) this.rain(false); return on; },

})();

function renderQ(){
  const q=QS[S.qi], st=STOPS[q.stop], order=S.order[S.qi]||[0,1,2];
  const firstOfStop = S.qi===0 || QS[S.qi-1].stop!==q.stop;
  $view.innerHTML = `
  <section class="q">
    ${routeHTML(q.stop)}
    <div class="scene"><canvas id="cv" aria-label="${esc(st.name)}的像素場景"></canvas><div class="tag">${esc(st.tag)}</div></div>
    <div class="eyebrow">STOP ${String(q.stop+1).padStart(2,'0')} · ${esc(st.code)} · Q${String(S.qi+1).padStart(2,'0')}/12</div>
    <h2 id="qt" aria-live="polite"></h2>
    <div class="opts">${order.map((ci,k)=>`<button class="ticket" type="button" data-ci="${ci}"><span class="stub">${'ABC'[k]}</span><span class="txt">${esc(q.o[ci].t)}</span></button>`).join('')}</div>
    <div class="qfoot"><button class="ghost" id="back" type="button" ${S.qi===0?'hidden':''}>← 上一題</button><span>按 1、2、3 也能作答</span></div>
  </section>`;
  mountScene(document.getElementById('cv'),st.key);
  if(firstOfStop && S.qi>0 && st.key==='airport') Snd.chime();
  const qt=document.getElementById('qt'), btns=[...document.querySelectorAll('.ticket')];
  const show=()=>btns.forEach((b,i)=>setTimeout(()=>b.classList.add('in'), reduce?0:i*90));
  if(reduce){ qt.textContent=q.q; show(); }
  else { let n=0; qt.onclick=()=>{ n=q.q.length; }; typer=setInterval(()=>{ n+=1; qt.textContent=q.q.slice(0,n); if(n>=q.q.length){ clearInterval(typer); show(); } },28); setTimeout(show,q.q.length*28*.6); }
  let locked=false;
  btns.forEach(b=>b.onclick=()=>{
    if(locked) return; locked=true; b.classList.add('picked','in'); Snd.pick(); setTimeout(()=>Snd.stamp(),120);
    S.picks[S.qi]=+b.dataset.ci; S.picks.length=S.qi+1;
    setTimeout(()=>{ if(S.qi<QS.length-1){ S.qi++; } else { S.screen='result'; Snd.done(); } render(); }, reduce?150:520);
  });
  document.getElementById('back').onclick=()=>{ if(S.qi>0){ S.qi--; S.picks.length=S.qi; render(); } };
}

function axisRows(){
  const {t}=totals(); const code=result();
  return AX.map((a,j)=>{
    const v=t[a.k], max = v>=0?axisMax(a.k,1):axisMax(a.k,-1);
    const pct=Math.min(50, Math.round(Math.abs(v)/Math.max(1,max)*50)+6);
    const posWin = code[j]===a.pos;
    const left = posWin?50:50-pct;
    return `<div class="axis"><span class="l ${posWin?'on':'off'}">${a.posL}</span><span class="track"><i style="left:${posWin?50-pct:50}%;width:${pct}%"></i></span><span class="${posWin?'off':'on'}">${a.negL}</span></div>`;
  }).join('');
}
function bookHTML(b){
  const col=PUB_COLOR[b.pub]||'#4d5b6a';
  return `<a class="book" href="${esc(b.url)}" target="_blank" rel="noopener"><span class="spine" style="background:${col}">${esc(b.pub.replace(/出版社?$/,''))}</span>
    <div><div class="bt">${esc(b.title)}</div><div class="bm">${esc(b.pub)}・${esc(b.author)}・${esc((b.date||'').slice(0,7))}</div><div class="bb">${esc(b.blurb)}</div><div class="go-link">到城邦讀書花園看這本書 ↗</div></div></a>`;
}

function renderResult(){
  const code=result(), T=TYPES[code], buddy=flip(code,[0]), clash=flip(code,[1,2]);
  const top=T.books.slice(0,3), rest=T.books.slice(3);
  const destName=d=>d.replace(/（.*?）/,''), destTag=d=>(d.match(/（(.*?)）/)||[])[1]||'';
  $view.innerHTML = `
  <section class="hero" style="gap:14px">
    <article class="visa" aria-label="你的旅人類型">
      <div class="vhead">
        <div style="min-width:0"><div class="lbl">TRAVELER TYPE · 旅人類型</div><div class="code" style="margin-top:10px">${code}</div><h2 class="vname">${esc(T.name)}</h2><div class="vaxes">${esc(T.axes)}</div></div>
        <div class="seal" aria-hidden="true"><div>${esc(T.name)}<small>APPROVED</small></div></div>
      </div>
      <p class="vdesc">${esc(T.desc)}</p>
      <div class="sec"><h3>PROFILE<span>你的三個旅行傾向</span></h3>${axisRows()}</div>
      <div class="sec"><h3>NEXT DESTINATION<span>適合你的下一站</span></h3>
        <div class="dests">${T.dest.map(d=>`<div class="dest"><span class="lbl">${esc(destTag(d))}</span><b>${esc(destName(d))}</b></div>`).join('')}</div></div>
      <div class="sec"><h3>READING LIST<span>從城邦書目為你挑的書</span></h3>
        <div class="books">${top.map(bookHTML).join('')}<div id="rest" hidden>${rest.map(bookHTML).join('')}</div></div>
        ${rest.length?`<button class="more" id="more" type="button">再看 ${rest.length} 本</button>`:''}</div>
      <div class="sec"><h3>TRAVEL BUDDY<span>旅伴配對</span></h3>
        <div class="pair">
          <div><span class="lbl">最合拍</span><b>${esc(TYPES[buddy].name)}</b><p>你們只差在要不要排行程，剛好一個規劃、一個製造驚喜。</p></div>
          <div><span class="lbl">最容易吵架</span><b>${esc(TYPES[clash].name)}</b><p>你們對「好玩」的定義不太一樣，出發前先講好各自的底線。</p></div>
        </div></div>
      <div class="sec"><h3>TIP<span>給你的旅行小提醒</span></h3><p style="margin:0">${esc(TIPS[code])}</p></div>
    </article>
    <div class="acts">
      <button class="primary" id="save" type="button" hidden>下載旅人卡</button>
      <button class="primary" id="copy" type="button">複製我的結果</button>
      <button class="secondary" id="again" type="button">再玩一次</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="sec" style="gap:8px"><div class="lbl" style="color:var(--mist)">全部 8 種旅人</div>
      <div class="stamps">${ORDER.map(c=>`<div class="mini ${c===code?'me':''}"><b>${c}</b><span>${esc(TYPES[c].name)}</span></div>`).join('')}</div></div>
  </section>`;
  const toast=m=>{ document.getElementById('toast').textContent=m; };
  const more=document.getElementById('more'); if(more) more.onclick=()=>{ const r=document.getElementById('rest'); r.hidden=!r.hidden; r.style.display=r.hidden?'':'contents'; more.textContent=r.hidden?`再看 ${rest.length} 本`:'收起'; };
  document.getElementById('again').onclick=()=>{ S={screen:'title',qi:0,picks:[],order:[]}; render(); };
  const shareText=`我是「${T.name}」${code}！${T.desc}\n推薦目的地：${T.dest.map(destName).join('、')}\n城邦選書：${top.map(b=>'《'+b.title.split(/[：:]/)[0]+'》').join('、')}\n你是哪種旅人？`;
  document.getElementById('copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(shareText); toast('已複製，可以貼到 LINE 或 IG 了。'); }catch(e){ toast('這個視窗不允許複製，請手動選取上方文字。'); } };
  const saveBtn=document.getElementById('save');
  getDownloads().then(dl=>{ if(!dl) return; saveBtn.hidden=false; saveBtn.onclick=async()=>{
    saveBtn.disabled=true; toast('正在產生旅人卡……');
    try{ const blob=await drawCard(code,T); await dl.save({filename:`旅人卡_${T.name}_${code}.png`, data:blob}); toast('旅人卡已儲存。'); }
    catch(e){ toast(e&&e.code==='declined'?'已取消下載。':'這裡無法下載，可以改用「複製我的結果」。'); }
    finally{ saveBtn.disabled=false; }
  }; });
}

/* ---------- 旅人卡 PNG（1080×1350） ---------- */
let dlP=null;
function getDownloads(){ if(!dlP) dlP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(webDownloads); return dlP; }
const webDownloads = { save({filename,data}){ const u=URL.createObjectURL(data), a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); return Promise.resolve({status:'saved'}); } };
async function drawCard(code,T){
  try{ await Promise.all(['700 60px "LXGW WenKai TC"','400 60px "VT323"','500 30px "Noto Sans TC"'].map(f=>document.fonts.load(f,'旅人ABC'))); }catch(e){}
  const c=document.createElement('canvas'); c.width=1080; c.height=1350; const g=c.getContext('2d');
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  g.fillStyle=css('--cover'); g.fillRect(0,0,1080,1350);
  g.fillStyle=css('--paper'); roundRect(g,60,60,960,1230,40); g.fill();
  g.strokeStyle='rgba(46,92,140,.08)'; g.lineWidth=3; for(let x=-1350;x<1080;x+=26){ g.beginPath(); g.moveTo(x,60); g.lineTo(x+1230,1290); g.stroke(); }
  g.fillStyle=css('--ink-soft'); g.font='400 40px "VT323", monospace'; g.fillText('TRAVELER TYPE · 旅人類型',120,160);
  g.fillStyle=css('--ink'); g.font='400 260px "VT323", monospace'; g.fillText(code,110,390);
  g.font='700 96px "LXGW WenKai TC", serif'; g.fillText(T.name,120,520);
  g.fillStyle=css('--ink-soft'); g.font='500 34px "Noto Sans TC", sans-serif'; g.fillText(T.axes,124,580);
  g.save(); g.translate(830,300); g.rotate(-0.25); g.strokeStyle=css('--stamp'); g.lineWidth=8; g.beginPath(); g.arc(0,0,120,0,Math.PI*2); g.stroke(); g.lineWidth=3; g.beginPath(); g.arc(0,0,104,0,Math.PI*2); g.stroke();
  g.fillStyle=css('--stamp'); g.textAlign='center'; g.font='700 44px "LXGW WenKai TC", serif'; g.fillText(T.name,0,6); g.font='400 34px "VT323", monospace'; g.fillText('APPROVED',0,48); g.restore();
  g.fillStyle=css('--ink'); g.font='400 46px "LXGW WenKai TC", serif'; wrap(g,T.desc,120,680,840,68);
  g.fillStyle=css('--stamp-blue'); g.font='400 40px "VT323", monospace'; g.fillText('NEXT DESTINATION',120,880);
  T.dest.forEach((d,i)=>{ const x=120+i*290; g.strokeStyle='#c8cdbd'; g.lineWidth=3; roundRect(g,x,905,270,130,20); g.stroke(); g.fillStyle=css('--ink-soft'); g.font='400 30px "VT323", monospace'; g.fillText((d.match(/（(.*?)）/)||[])[1]||'',x+22,950); g.fillStyle=css('--ink'); g.font='700 40px "LXGW WenKai TC", serif'; wrap(g,d.replace(/（.*?）/,''),x+22,1004,236,46); });
  g.fillStyle=css('--stamp-blue'); g.font='400 40px "VT323", monospace'; g.fillText('READING LIST',120,1110);
  g.fillStyle=css('--ink'); g.font='500 32px "Noto Sans TC", sans-serif'; T.books.slice(0,2).forEach((b,i)=>{ g.fillText('《'+clip(g,b.title.split(/[：:]/)[0],780)+'》',120,1160+i*48); });
  g.fillStyle=css('--cover'); g.font='700 34px "LXGW WenKai TC", serif'; g.fillText('出發吧！你是哪種旅人？',120,1262); g.textAlign='right'; g.font='400 32px "VT323", monospace'; g.fillText('TPE ✈ '+code,960,1262);
  return new Promise(res=>c.toBlob(res,'image/png'));
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrap(g,text,x,y,maxW,lh){ let line=''; for(const ch of text){ if(g.measureText(line+ch).width>maxW){ g.fillText(line,x,y); line=ch; y+=lh; } else line+=ch; } if(line) g.fillText(line,x,y); }
function clip(g,s,maxW){ if(g.measureText(s).width<=maxW) return s; while(s.length&&g.measureText(s+'…').width>maxW) s=s.slice(0,-1); return s+'…'; }

/* ---------- 控制 ---------- */
const sndBtn=document.getElementById('snd');
sndBtn.onclick=()=>{ const on=Snd.toggle(); sndBtn.textContent='音效 '+(on?'開':'關'); sndBtn.setAttribute('aria-pressed',on); if(on&&sceneKey==='rain'&&S.screen==='play') Snd.rain(true); };
document.addEventListener('keydown',e=>{ if(S.screen!=='play') return; const n='123'.indexOf(e.key); if(n>=0){ const b=document.querySelectorAll('.ticket')[n]; if(b) b.click(); } });

if(hot && hot.snapshot) hot.snapshot(()=>({screen:S.screen,qi:S.qi,picks:S.picks,order:S.order}));
if(hot && hot.ready) hot.ready(boot); else boot(hot && hot.data);
})();
</script>
